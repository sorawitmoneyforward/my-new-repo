[project]
name = "tsuchida-taku-vader"
version = "0.1.0"
description = "Credit scoring model for Vader"
requires-python = ">=3.10"
dependencies = [
    "boto3==1.36.21",
    "botocore==1.36.21",
    "certifi==2025.1.31",
    "charset-normalizer==3.4.1",
    "click==8.1.8",
    "databricks-cli==0.18.0",
    "exceptiongroup==1.2.2",
    "idna==3.10",
    "imbalanced-learn==0.12.4",
    "iniconfig==2.0.0",
    "jmespath==1.0.1",
    "joblib==1.4.2",
    "numpy==1.26.4",
    "oauthlib==3.2.2",
    "packaging==24.2",
    "pandas==2.2.3",
    "pluggy==1.5.0",
    "py4j==0.10.9.7",
    "PyJWT==2.10.1",
    "pytest==8.3.4",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.1",
    "requests==2.32.4",
    "s3transfer==0.11.2",
    "scikit-learn==1.0.2",
    "scipy==1.15.2",
    "six==1.17.0",
    "tabulate==0.9.0",
    "threadpoolctl==3.5.0",
    "tomli==2.2.1",
    "tzdata==2025.1",
    "urllib3==2.3.0",
    "pyspark==3.5.4",
    "delta-spark==3.2.0",
    "pyarrow==14.0.1",
    "pydantic==2.11.7",
    "PyYAML>=6.0",
    "Jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    # Formatting
    "black>=24.2.0",
    "isort>=5.13.2",
    
    # Linting
    "flake8>=7.0.0",
    "pyproject-flake8>=0.0.1",
    
    # Testing
    "pytest>=8.0.0",
    
    # Type checking
    "types-python-dateutil>=2.8.19",
    "pandas-stubs>=2.1.4",
]

[tool.black]
max-line-length = 120
target-version = ["py39"]
lignore = ["E203", "W503", "W504"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.flake8]
max-line-length = 120
exclude = ['.git', '__pycache__', 'build', 'dist']