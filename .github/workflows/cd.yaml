name: CD Pipeline

on:
  push:
    branches: [main, test, sandbox]
    paths:
      - 'aws/lambda/**'
      - '.github/workflows/cd.yaml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: cd-${{ github.ref }}-${{ matrix.resource.name }}
      cancel-in-progress: true

    strategy:
      matrix:
        resource:
          - name: get_luke_score
            path: aws/lambda/get_luke_score
            ecr: credit-scoring-lambda-get-luke-score
            fn: credit-scoring-get-luke-score-api
          - name: get_anakin_score
            path: aws/lambda/get_anakin_score
            ecr: credit-scoring-lambda-get-anakin-score
            fn: credit-scoring-get-anakin-score-api
          - name: get_obiwan_score
            path: aws/lambda/get_obiwan_score
            ecr: credit-scoring-lambda-get-obiwan-score
            fn: credit-scoring-get-obiwan-score-api
          - name: get_vader_score
            path: aws/lambda/get_vader_score
            ecr: credit-scoring-lambda-get-vader-score
            fn: credit-scoring-get-vader-score-api

    env:
      AWS_ROLE_ARN: ${{ github.ref_name == 'main' && secrets.PROD_ROLE_ARN
                || github.ref_name == 'test' && secrets.TEST_ROLE_ARN
                || secrets.SANDBOX_ROLE_ARN }}

      AWS_REGION: ${{ github.ref_name == 'main' && secrets.PROD_REGION
                || github.ref_name == 'test' && secrets.TEST_REGION
                || secrets.SANDBOX_REGION }}

      ECR_REPOSITORY: mfw-${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'test' && 'test' || 'sandbox' }}-${{ matrix.resource.ecr }}

      LAMBDA_NAME: mfw-${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'test' && 'test' || 'sandbox' }}-${{ matrix.resource.fn }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Build and push image
        uses: docker/build-push-action@v5
        id: build-image
        with:
          context: aws/lambda
          file: ${{ matrix.resource.path }}/Dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          provenance: false
          platforms: linux/arm64
          cache-from: type=gha,scope=${{ matrix.resource.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.resource.name }}

      - name: Update Lambda image
        id: update-lambda
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build-image.outputs.digest }}
          echo "Deploying image: $IMAGE_URI"

          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_NAME }} \
            --image-uri "$IMAGE_URI" \
            --publish \
            --region ${{ env.AWS_REGION }}

          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_NAME }} \
            --region ${{ env.AWS_REGION }}
