name: Claude PR Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  auto_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine changed files
        id: changes
        run: |
          files=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path' | tr '\n' ' ')
          echo "files=$files" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Claude Code Action (auto-review)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            You are an expert security reviewer. Review the pull request changes and identify security-relevant issues.
            
            Focus on:
            - Authentication and authorization issues
            - SQL/NoSQL injection vulnerabilities
            - Hardcoded secrets or credentials
            - Input validation problems
            - Deserialization vulnerabilities
            - SSRF/XXE vulnerabilities
            - Access control flaws
            
            If no security issues are found, provide a brief "No material security risks found" summary.
            Avoid style nitpicks and focus only on security concerns.