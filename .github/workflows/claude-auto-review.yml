name: Claude PR Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine changed files
        id: changes
        run: |
          echo "files=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path' | tr 'n' ' ')" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Claude Code Action (auto-review)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are an expert reviewer. Review only security-relevant changes.
            - Focus on: auth, access control, SQL/NoSQL queries, secrets, input validation, deserialization, SSRF/XXE.
            - If no issues, leave a brief "no material risk found" summary.
            - Avoid style nitpicks.
          # Example: restrict review to backend paths via claude_args or pre-filter your diffs